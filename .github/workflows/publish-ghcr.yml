name: Build and push image (GHCR)

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: vars
        run: echo "TAG=master-$(date +%s)-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/erikssonjames/portfolio:${{ steps.vars.outputs.TAG }}
          build-args: |
            NEXT_PUBLIC_EMAIL=${{ vars.NEXT_PUBLIC_EMAIL }}
            NEXT_PUBLIC_GITHUB=${{ vars.NEXT_PUBLIC_GITHUB }}
            NEXT_PUBLIC_LINKED_IN=${{ vars.NEXT_PUBLIC_LINKED_IN }}
      
      - name: Build & Push (migrator)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: migrator
          tags: ghcr.io.erikssonjames/portfolio-migrator:${{ steps.vars.outputs.TAG }}
          build-args: |
            NEXT_PUBLIC_EMAIL=${{ vars.NEXT_PUBLIC_EMAIL }}
            NEXT_PUBLIC_GITHUB=${{ vars.NEXT_PUBLIC_GITHUB }}
            NEXT_PUBLIC_LINKED_IN=${{ vars.NEXT_PUBLIC_LINKED_IN }}